apiVersion: apps/v1
kind: Deployment
metadata:
  name: dilek-feneri-demo
  namespace: dilek-feneri-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dilek-feneri-demo
  template:
    metadata:
      labels:
        app: dilek-feneri-demo
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app
          image: ghcr.io/ayavuzer/dilek-kumbarasi:demo-v0.1.14
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DEMO_MODE
              value: "true"
            - name: PUBLIC_BASE_PATH
              value: /dilek
            - name: PUBLIC_DOMAIN
              value: https://demo.mindops.net/dilek
            - name: AI_MODERATION_PROVIDER
              value: gemini
            - name: GEMINI_BASE_URL
              value: https://generativelanguage.googleapis.com/v1beta/openai/
            - name: GEMINI_TEXT_MODEL
              value: gemini-3.5-flash
            - name: GEMINI_API_KEY_1
              valueFrom:
                secretKeyRef:
                  name: dilek-kumbarasi-ai
                  key: GEMINI_API_KEY_1
                  optional: true
            - name: GEMINI_API_KEY_2
              valueFrom:
                secretKeyRef:
                  name: dilek-kumbarasi-ai
                  key: GEMINI_API_KEY_2
                  optional: true
          # Pod sonlandirilirken ingress endpoint listesini guncellemesi birkac
          # saniye suruyor; o aralikta kapanmakta olan pod'a gelen istekler 502
          # alabiliyor. preStop bu sure boyunca sunucuyu ayakta tutar: kubelet
          # pod'u Endpoints'ten cikarirken container servis etmeye devam eder.
          #
          # Not: server.js SIGTERM'i bilerek yok sayiyor ("staying alive"), bu
          # yuzden pod zaten grace period sonunda SIGKILL ile kapaniyor. preStop
          # bu sureyi uzatmiyor, icine giriyor.
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 10']
          volumeMounts:
            - mountPath: /app/uploads
              name: dilek-storage
              subPath: uploads
            - mountPath: /app/data
              name: dilek-storage
              subPath: data
      volumes:
        - name: dilek-storage
          persistentVolumeClaim:
            claimName: dilek-feneri-demo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dilek-feneri-demo
  namespace: dilek-feneri-demo
spec:
  selector:
    app: dilek-feneri-demo
  ports:
    - name: http
      port: 80
      targetPort: 3000
