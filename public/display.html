<!doctype html>
<html lang="tr" data-background-theme="default">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__DISPLAY_TITLE__</title>
  <meta property="og:title" content="__DISPLAY_TITLE__" />
  <meta property="og:site_name" content="__DISPLAY_SITE__" />
  <meta property="og:type" content="website" />
  <meta property="twitter:title" content="__DISPLAY_TITLE__" />
  <script>
    document.documentElement.classList.add('display-booting');
    window.finishDisplayBoot = function () {
      document.documentElement.classList.remove('display-booting');
    };
    window.setTimeout(window.finishDisplayBoot, 5000);
  </script>
  <link rel="stylesheet" href="css/themes.css?v=18.9.8" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --design-width: 960px;
      --design-height: 2160px;
      --design-width-num: 960;
      --design-height-num: 2160;
    }

    /* Match bars to the default lantern background */
    html {
      background: #030810;
    }

    html.display-booting,
    html.display-booting body {
      background: #050817;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: "Nunito", sans-serif;
      position: relative;
    }

    /* Main container */
    .display-container {
      width: var(--design-width);
      height: var(--design-height);
      position: relative;
      /* Arkaplan themes.css tarafindan yonetiliyor */
    }

    /* Background image covers entire viewport - no animation needed */

    /* Floating decorations removed - background image has lanterns and lights */
    .decorations,
    .shapes {
      display: none;
    }

    /* Header — themes.css tarafından stilize ediliyor */
    .display-header {
      display: flex;
    }

    /* Wishes container - full screen, balloons float freely under header */
    #wishes-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    #wishes-container.spotlight-mode .wish-card {
      opacity: 0.3;
      transition:
        opacity 0.5s,
        transform 0.5s;
    }

    #wishes-container.spotlight-mode .wish-card.spotlight-active {
      opacity: 1;
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) scale(1.2) !important;
      z-index: 600 !important;
      filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.6));
      animation: spotlightPulse 2s ease-in-out infinite;
    }

    @keyframes spotlightPulse {

      0%,
      100% {
        filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.6));
      }

      50% {
        filter: drop-shadow(0 0 60px rgba(255, 215, 0, 0.9));
      }
    }

    /* Balloon wish card */
    .wish-card {
      position: absolute;
      width: 320px;
      cursor: pointer;
      will-change: transform;
      /* Optimized GPU rendering */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .balloon-body {
      position: relative;
      width: 320px;
      height: 380px;
      background:
        radial-gradient(circle at 35% 25%,
          rgba(255, 255, 255, 0.35) 0%,
          transparent 50%),
        radial-gradient(circle at 65% 75%,
          rgba(0, 0, 0, 0.15) 0%,
          transparent 50%),
        linear-gradient(160deg,
          var(--balloon-color) 0%,
          var(--balloon-color-dark, var(--balloon-color)) 100%);
      border-radius: 50% 50% 45% 45%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      /* Optimized for speed */
      overflow: hidden;
      transition:
        box-shadow 0.3s,
        transform 0.3s;
    }

    /* Primary glossy shine - bright reflection */
    .balloon-body::before {
      content: "";
      position: absolute;
      top: 8%;
      left: 15%;
      width: 40%;
      height: 35%;
      background: radial-gradient(ellipse,
          rgba(255, 255, 255, 0.55) 0%,
          rgba(255, 255, 255, 0.1) 40%,
          transparent 70%);
      border-radius: 50%;
      transform: rotate(-20deg);
      pointer-events: none;
    }

    /* Balloon knot */
    .balloon-body::after {
      content: "";
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      background: var(--balloon-color, #ff6b6b);
      clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
      filter: brightness(0.85);
    }

    /* Balloon string - wavy */
    .balloon-string {
      width: 3px;
      height: 80px;
      background: linear-gradient(to bottom,
          rgba(0, 0, 0, 0.25),
          rgba(0, 0, 0, 0.05));
      margin-top: -1px;
      position: relative;
      animation: stringWave 3s ease-in-out infinite;
      transform-origin: top center;
    }

    @keyframes stringWave {

      0%,
      100% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(2deg);
      }

      75% {
        transform: rotate(-2deg);
      }
    }

    .balloon-string::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 50%;
    }

    .wish-card:hover {
      z-index: 100;
    }

    .wish-card:hover .balloon-body {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      /* Optimized for speed */
      transform: scale(1.05);
    }

    /* ═══ DİLEK FENERİ (SKY LANTERN) MODE ═══ */
    /* Gerçekçi gökyüzü feneri — yarı saydam kağıt, iç alev, sıcak glow */

    .wish-card.lantern-mode {
      width: 320px;
    }

    /* Fener gövdesi — yuvarlak kağıt balon şekli */
    .lantern-body {
      position: relative;
      width: var(--lantern-size, 240px);
      height: var(--lantern-size, 240px);
      margin: 0 auto;
      background: url("images/lantern.png?v=10.0.0") center/contain no-repeat;
      overflow: visible;
      transition: filter 0.4s ease, width 0.3s ease, height 0.3s ease;
    }

    /* İç parıltı + kağıt grain efekti */
    /* Warm ambient glow behind the lantern SVG */
    .lantern-body::before {
      content: "";
      position: absolute;
      top: 5%;
      left: 5%;
      width: 90%;
      height: 90%;
      background: radial-gradient(ellipse at 50% 55%,
          rgba(255, 150, 120, 0.1) 0%,
          transparent 60%);
      border-radius: 50%;
      animation: lanternGlow 3s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    /* Alt ağız — tel çerçeve (wire frame) */
    /* Light spilling from lantern bottom opening */
    .lantern-body::after {
      content: "";
      position: absolute;
      bottom: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 40%;
      height: 12px;
      background: radial-gradient(ellipse at 50% 0%,
          rgba(255, 150, 120, 0.2) 0%,
          transparent 70%);
      z-index: 5;
      pointer-events: none;
    }

    /* Alev — fenerin alt açıklığında */
    .lantern-flame {
      position: absolute;
      bottom: 31%;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 26px;
      background: radial-gradient(ellipse at 50% 80%,
          rgba(255, 255, 200, 1) 0%,
          rgba(255, 200, 50, 0.95) 25%,
          rgba(255, 140, 20, 0.7) 50%,
          rgba(255, 80, 0, 0.3) 75%,
          transparent 100%);
      border-radius: 50% 50% 35% 35%;
      animation: flameFlicker 0.8s ease-in-out infinite;
      z-index: 10;
      pointer-events: none;
    }

    /* Alev dış glow halkası */
    .lantern-flame::after {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 46px;
      height: 46px;
      background: radial-gradient(circle,
          rgba(255, 180, 60, 0.35) 0%,
          rgba(255, 120, 20, 0.12) 40%,
          transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9;
    }

    /* İp — fenerin altından sarkan kısa iplik */
    .lantern-string {
      width: 2px;
      height: 0px;
      margin: 0 auto;
      position: relative;
    }

    /* Fener altı metin alanı — düz beyaz yazı */
    .lantern-text {
      width: 148px;
      margin: 0 auto;
      text-align: center;
      pointer-events: none;
      overflow: visible;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    /* Fener metin stilleri — beyaz düz yazı */
    .wish-card.lantern-mode .wish-text {
      position: relative;
      top: auto;
      left: auto;
      transform: skewX(-5deg);
      width: auto;
      max-height: none;
      padding: 0;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      font-style: italic;
      font-family: "Centrale Sans", "Nunito", sans-serif;
      line-height: 1.24;
      text-align: center;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 7;
      max-height: 170px;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .wish-card.lantern-mode .child-name {
      position: relative;
      bottom: auto;
      left: auto;
      transform: skewX(-5deg);
      width: auto;
      max-width: 100%;
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: #FFD700;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
      margin: 4px auto 0;
      text-align: center;
      font-family: "Centrale Sans", "Nunito", sans-serif;
      font-style: italic;
      z-index: 2;
      white-space: nowrap;
      overflow: visible;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .wish-card.lantern-mode .child-name::before {
      display: none;
    }

    @keyframes lanternGlow {

      0%,
      100% {
        opacity: 0.5;
      }

      30% {
        opacity: 0.95;
      }

      50% {
        opacity: 0.7;
      }

      70% {
        opacity: 1;
      }
    }

    @keyframes flameFlicker {
      0% {
        transform: translateX(-50%) scaleY(1) scaleX(1);
        opacity: 0.85;
      }

      15% {
        transform: translateX(-50%) scaleY(1.12) scaleX(0.88);
        opacity: 1;
      }

      30% {
        transform: translateX(-50%) scaleY(0.92) scaleX(1.08);
        opacity: 0.9;
      }

      50% {
        transform: translateX(-50%) scaleY(1.08) scaleX(0.92);
        opacity: 0.95;
      }

      70% {
        transform: translateX(-50%) scaleY(0.95) scaleX(1.04);
        opacity: 0.88;
      }

      85% {
        transform: translateX(-50%) scaleY(1.06) scaleX(0.94);
        opacity: 1;
      }

      100% {
        transform: translateX(-50%) scaleY(1) scaleX(1);
        opacity: 0.85;
      }
    }

    /* Fener giriş animasyonu JS tarafından yönetiliyor (fade-in + sinüs salınımı) */
    .wish-card.lantern-mode.entering {
      /* CSS animasyonu yok — JS opacity ve transform ile hallediliyor */
      animation: none !important;
    }

    .wish-card.lantern-mode:hover .lantern-body {
      filter: brightness(1.12);
    }

    /* ═══ YENİ DİLEK GİRİŞ EFEKTİ — 5sn altın parıltı ═══ */
    /* Sadece socket 'new-wish' tetikler, DOM recycling tetiklemez */
    .wish-card.lantern-mode.new-wish-highlight .lantern-body::before {
      background: radial-gradient(ellipse at 50% 55%,
          rgba(255, 220, 80, 0.7) 0%,
          rgba(255, 180, 40, 0.45) 30%,
          rgba(255, 120, 0, 0.2) 55%,
          transparent 80%);
      animation: newWishGlow 5s ease-out forwards;
    }

    /* Eski parşömen highlight kaldırıldı — metin artık düz beyaz */

    @keyframes newWishGlow {
      0% {
        opacity: 1;
        transform: scale(1.3);
      }

      20% {
        opacity: 1;
        transform: scale(1.15);
      }

      60% {
        opacity: 0.85;
        transform: scale(1.05);
      }

      100% {
        opacity: 0.5;
        transform: scale(1);
      }
    }

    /* ═══ AY — sağ üst köşede parlayan ay ═══ */
    /* Star lantern mode: blue-white festival kite form */
    .wish-card.star-lantern-mode {
      width: 340px;
      transform-origin: top left;
    }

    .wish-card.star-lantern-mode.entering {
      animation: none !important;
    }

    .star-lantern-body {
      position: relative;
      width: var(--star-lantern-width, 322px);
      height: var(--star-lantern-height, 306px);
      margin: 0 auto;
      background: url("images/star-lantern.svg?v=2") center center / contain no-repeat;
      transform-style: preserve-3d;
      filter: drop-shadow(0 24px 32px rgba(0, 16, 36, 0.38));
      pointer-events: none;
    }

    .star-lantern-wing,
    .star-lantern-core,
    .star-lantern-tail,
    .star-lantern-spine,
    .star-lantern-arm,
    .star-lantern-orb {
      position: absolute;
      pointer-events: none;
    }

    .star-lantern-wing {
      top: 94px;
      width: 166px;
      height: 78px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.98) 0%, rgba(214, 238, 255, 0.84) 46%, rgba(255, 239, 204, 0.92) 100%),
        repeating-linear-gradient(30deg, rgba(0, 82, 199, 0.18) 0 1px, transparent 1px 18px);
      border: 1px solid rgba(255, 255, 255, 0.84);
      clip-path: polygon(0 50%, 96% 0, 88% 82%, 5% 88%);
      box-shadow: inset 0 -14px 24px rgba(255, 183, 82, 0.24), inset 0 12px 24px rgba(39, 121, 255, 0.14);
    }

    .star-lantern-wing--left {
      left: 1px;
      transform: rotate(-4deg) skewY(-3deg);
      transform-origin: right center;
    }

    .star-lantern-wing--right {
      right: 1px;
      transform: scaleX(-1) rotate(-4deg) skewY(-3deg);
      transform-origin: left center;
    }

    .star-lantern-core {
      top: 3px;
      left: 99px;
      width: 132px;
      height: 204px;
      clip-path: polygon(50% 0, 96% 47%, 72% 100%, 50% 90%, 28% 100%, 4% 47%);
      background:
        radial-gradient(circle at 24% 38%, rgba(255, 255, 255, 0.92) 0 2px, transparent 2.4px),
        radial-gradient(circle at 62% 24%, rgba(255, 255, 255, 0.9) 0 1.7px, transparent 2.2px),
        radial-gradient(circle at 64% 58%, rgba(255, 255, 255, 0.82) 0 2px, transparent 2.4px),
        linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(0, 79, 205, 0.9) 33%, rgba(0, 35, 145, 0.98) 62%, rgba(255, 244, 218, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: inset 0 0 26px rgba(255, 255, 255, 0.46), 0 0 26px rgba(51, 149, 255, 0.32);
      z-index: 4;
    }

    .star-lantern-core::before {
      content: "";
      position: absolute;
      inset: 22px 42px 24px;
      background: linear-gradient(180deg, rgba(48, 152, 255, 0.92), rgba(0, 25, 112, 0.96) 58%, rgba(255, 242, 214, 0.56));
      clip-path: polygon(50% 0, 100% 46%, 50% 100%, 0 46%);
      box-shadow: 0 0 18px rgba(0, 114, 255, 0.62);
    }

    .star-lantern-spine {
      top: 36px;
      left: 50%;
      width: 2px;
      height: 160px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(255, 196, 75, 0.98), rgba(0, 111, 255, 0.95), rgba(255, 232, 177, 0.9));
      box-shadow: 0 0 8px rgba(255, 210, 112, 0.72);
      z-index: 7;
    }

    .star-lantern-tail {
      left: 50%;
      top: 174px;
      width: 32px;
      height: 104px;
      transform: translateX(-50%);
      clip-path: polygon(50% 100%, 100% 0, 0 0);
      background: linear-gradient(180deg, rgba(255, 247, 224, 0.98), rgba(229, 245, 255, 0.86) 52%, rgba(255, 255, 255, 0.98) 100%);
      box-shadow: inset 0 0 16px rgba(0, 92, 211, 0.18);
      z-index: 3;
    }

    .star-lantern-arm {
      top: 79px;
      width: 118px;
      height: 70px;
      border-top: 3px solid rgba(0, 85, 204, 0.92);
      border-radius: 70% 70% 0 0;
      box-shadow: 0 -1px 5px rgba(72, 184, 255, 0.55);
      z-index: 6;
    }

    .star-lantern-arm--left {
      left: 45px;
      transform: rotate(-26deg);
      transform-origin: right bottom;
    }

    .star-lantern-arm--right {
      right: 45px;
      transform: scaleX(-1) rotate(-26deg);
      transform-origin: left bottom;
    }

    .star-lantern-orb {
      top: 64px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0 26%, #7fe6ff 38%, #006bff 72%, rgba(255, 205, 94, 0.86) 100%);
      box-shadow: 0 0 12px rgba(93, 213, 255, 0.82), inset 0 0 5px rgba(255, 255, 255, 0.9);
      z-index: 8;
    }

    .star-lantern-orb--left {
      left: 43px;
    }

    .star-lantern-orb--right {
      right: 43px;
    }

    .star-lantern-text {
      width: 164px;
      margin: 26px auto 0;
      text-align: center;
      pointer-events: none;
      overflow: visible;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .wish-card.star-lantern-mode .wish-text {
      position: relative;
      top: auto;
      left: auto;
      transform: skewX(-4deg);
      width: auto;
      max-height: 170px;
      padding: 0;
      font-size: 20px;
      font-weight: 700;
      color: rgba(246, 254, 255, 0.96);
      text-shadow: 0 2px 8px rgba(0, 16, 48, 0.84), 0 0 8px rgba(70, 181, 255, 0.36);
      font-style: italic;
      font-family: "Centrale Sans", "Nunito", sans-serif;
      line-height: 1.16;
      text-align: center;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 6;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .wish-card.star-lantern-mode .child-name {
      position: relative;
      bottom: auto;
      left: auto;
      transform: skewX(-4deg);
      width: auto;
      max-width: 100%;
      display: block;
      font-size: 18px;
      font-weight: 900;
      color: #ffe59a;
      text-shadow: 0 1px 8px rgba(0, 17, 48, 0.72), 0 0 8px rgba(255, 213, 113, 0.5);
      margin: 6px auto 0;
      text-align: center;
      font-family: "Centrale Sans", "Nunito", sans-serif;
      font-style: italic;
      z-index: 2;
      white-space: nowrap;
      overflow: visible;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .wish-card.star-lantern-mode .child-name::before {
      display: none;
    }

    .wish-card.star-lantern-mode:hover .star-lantern-body {
      filter: brightness(1.08) drop-shadow(0 22px 34px rgba(0, 40, 90, 0.52));
    }

    .wish-card.star-lantern-mode.new-wish-highlight .star-lantern-body {
      animation: starLanternPulse 5s ease-out forwards;
    }

    @keyframes starLanternPulse {
      0% {
        filter: brightness(1.45) drop-shadow(0 0 34px rgba(116, 213, 255, 0.86));
        transform: scale(1.08);
      }

      35% {
        filter: brightness(1.22) drop-shadow(0 0 24px rgba(255, 223, 142, 0.64));
        transform: scale(1.035);
      }

      100% {
        filter: drop-shadow(0 22px 30px rgba(0, 16, 36, 0.4));
        transform: scale(1);
      }
    }

    .moon {
      position: absolute;
      top: 200px;
      right: 180px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%,
          #fffff0 0%,
          #fff8d0 25%,
          #ffe8a0 50%,
          #e0c070 80%);
      box-shadow:
        0 0 40px rgba(255, 230, 150, 0.4),
        0 0 100px rgba(255, 200, 100, 0.25),
        0 0 200px rgba(255, 180, 80, 0.12);
      z-index: 2;
      pointer-events: none;
      opacity: 0.85;
    }

    /* ═══ KOR PARÇACIKLARI — yükselen sıcak noktalar ═══ */
    .ember {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      animation: emberRise linear infinite;
    }

    @keyframes emberRise {
      0% {
        opacity: 0;
        transform: translateY(0) scale(1);
      }

      8% {
        opacity: 0.8;
      }

      60% {
        opacity: 0.5;
      }

      100% {
        opacity: 0;
        transform: translateY(-3000px) translateX(var(--drift, 30px)) scale(0.2);
      }
    }

    /* ═══ ÇAPRAZ YILDIZ PARILTISI — ✦ şekli ═══ */
    .sparkle-star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.9);
      pointer-events: none;
      z-index: 2;
      animation: sparkleGlint 4s ease-in-out infinite;
    }

    .sparkle-star::before,
    .sparkle-star::after {
      content: "";
      position: absolute;
    }

    .sparkle-star::before {
      width: 2px;
      height: 24px;
      top: -10px;
      left: 1px;
      background: linear-gradient(to bottom,
          transparent,
          rgba(255, 255, 255, 0.8),
          transparent);
    }

    .sparkle-star::after {
      width: 24px;
      height: 2px;
      left: -10px;
      top: 1px;
      background: linear-gradient(to right,
          transparent,
          rgba(255, 255, 255, 0.8),
          transparent);
    }

  <script>
    // Sabit 960x2160 — LED panel icin 1:1 render
    const DEMO_STAGE_LANDSCAPE = window.__DEMO_MODE === true || window.__DEMO_BASE_PATH === '/dilek';
    let DESIGN_WIDTH = DEMO_STAGE_LANDSCAPE ? 1920 : 960;
    let DESIGN_HEIGHT = DEMO_STAGE_LANDSCAPE ? 1080 : 2160;

    function scaleToFit() {
      // LED panel 960x2160 — olcek yok, 1:1
      document.documentElement.style.setProperty('--lantern-size', '240px');

      const scaledApp = document.getElementById('scaled-app');
      if (scaledApp) {
        scaledApp.style.transform = 'scale(1)';
        scaledApp.style.transformOrigin = 'top left';
        scaledApp.style.width = DESIGN_WIDTH + 'px';
        scaledApp.style.height = DESIGN_HEIGHT + 'px';
      }





      document.body.style.overflow = 'hidden';
      document.body.style.margin = '0';
      document.body.style.padding = '0';

      const container = document.querySelector(".display-container");
      if (container) {
        container.style.width = DESIGN_WIDTH + "px";
        container.style.height = DESIGN_HEIGHT + "px";
      }

      // Portrait mod tespiti — logos-bottom-bar column layout için
      const bar = document.querySelector('.logos-bottom-bar');
      if (bar) {
        if (h > w || w < 800) {
          bar.classList.add('portrait-mode');
        } else {
          bar.classList.remove('portrait-mode');
        }
      }
    }


    scaleToFit();
    // resize — recalculate scale + dimensions
    // resize listener final scaleToFit tanimindan sonra baglaniyor.

    scaleToFit = function () {
      const viewportWidth = window.innerWidth || DESIGN_WIDTH;
      const viewportHeight = window.innerHeight || DESIGN_HEIGHT;
      const isHorizontalCanvas = DESIGN_WIDTH >= DESIGN_HEIGHT;
      const isMessageWallMode = document.documentElement.classList.contains('display-mode-messagewall');
      const backgroundTheme = document.documentElement.getAttribute('data-background-theme');
      const isEtnosporTheme = backgroundTheme === 'etnospor' || backgroundTheme === 'aselsan';
      const screenWidth = window.screen && window.screen.width ? window.screen.width : 0;
      const screenHeight = window.screen && window.screen.height ? window.screen.height : 0;
      const isScreenSized = screenWidth > 0
        && screenHeight > 0
        && Math.abs(viewportWidth - screenWidth) <= 4
        && Math.abs(viewportHeight - screenHeight) <= 4;
      const isFullscreenLike = !!document.fullscreenElement
        || document.documentElement.classList.contains('display-fullscreen')
        || isScreenSized;
      let scale = 1;
      let scaleX = 1;
      let scaleY = 1;
      let stretchToViewport = false;

      document.documentElement.style.setProperty('--lantern-size', isHorizontalCanvas ? '260px' : '240px');

      if (isEtnosporTheme) {
        stretchToViewport = true;
        scaleX = viewportWidth / DESIGN_WIDTH;
        scaleY = viewportHeight / DESIGN_HEIGHT;
        scale = Math.min(scaleX, scaleY);
      } else if (isMessageWallMode || isEtnosporTheme) {
        scale = Math.min(viewportWidth / DESIGN_WIDTH, viewportHeight / DESIGN_HEIGHT);
      } else if (isHorizontalCanvas && viewportWidth >= viewportHeight) {
        scale = Math.max(viewportWidth / DESIGN_WIDTH, viewportHeight / DESIGN_HEIGHT);
      } else if (viewportWidth < DESIGN_WIDTH || viewportHeight < DESIGN_HEIGHT) {
        scale = Math.min(viewportWidth / DESIGN_WIDTH, viewportHeight / DESIGN_HEIGHT);
      }

      if (!Number.isFinite(scale) || scale <= 0) {
        scale = 1;
      }
      if (!stretchToViewport) {
        scaleX = scale;
        scaleY = scale;
      }
      if (!Number.isFinite(scaleX) || scaleX <= 0) scaleX = 1;
      if (!Number.isFinite(scaleY) || scaleY <= 0) scaleY = 1;

      let offsetX = stretchToViewport ? 0 : (viewportWidth - (DESIGN_WIDTH * scale)) / 2;
      let offsetY = stretchToViewport ? 0 : (viewportHeight - (DESIGN_HEIGHT * scale)) / 2;

      const scaledApp = document.getElementById('scaled-app');
      if (scaledApp) {
        scaledApp.style.transform = stretchToViewport
          ? `translate(${offsetX}px, ${offsetY}px) scale(${scaleX}, ${scaleY})`
          : `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
        scaledApp.style.transformOrigin = 'top left';
        scaledApp.style.width = DESIGN_WIDTH + 'px';
        scaledApp.style.height = DESIGN_HEIGHT + 'px';
      }
      document.documentElement.style.setProperty('--display-scale-x', String(scaleX));
      document.documentElement.style.setProperty('--display-scale-y', String(scaleY));

      const container = document.querySelector('.display-container');
      if (container) {
        container.style.width = DESIGN_WIDTH + 'px';
        container.style.height = DESIGN_HEIGHT + 'px';
      }

      document.body.style.overflow = 'hidden';
      document.body.style.margin = '0';
      document.body.style.padding = '0';
    };

    window.setDisplayCanvasSize = function (width, height) {
      DESIGN_WIDTH = width;
      DESIGN_HEIGHT = height;
      document.documentElement.style.setProperty('--design-width', width + 'px');
      document.documentElement.style.setProperty('--design-height', height + 'px');
      document.documentElement.style.setProperty('--design-width-num', String(width));
      document.documentElement.style.setProperty('--design-height-num', String(height));
      const viewportMeta = document.querySelector('meta[name="viewport"]');
      if (viewportMeta) {
        viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0');
      }
      scaleToFit();
    };

    // Kor parçacıkları oluştur
    const scheduleDisplayScaleToFit = () => requestAnimationFrame(scaleToFit);
    window.addEventListener("resize", scheduleDisplayScaleToFit);
    window.addEventListener("orientationchange", scheduleDisplayScaleToFit);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", scheduleDisplayScaleToFit);
    }

    window.setDisplayCanvasSize(DESIGN_WIDTH, DESIGN_HEIGHT);

    (function () {
      const ec = document.getElementById("embers-container");
      if (!ec) return;
      const colors = [
        "#FFD700",
        "#FFA500",
        "#FF6600",
        "#FF4500",
        "#FF8C00",
        "#FFB347",
      ];
      for (let i = 0; i < 18; i++) {
        const e = document.createElement("div");
        e.className = "ember";
        const size = 2 + Math.random() * 4;
        e.style.left = 5 + Math.random() * 90 + "%";
        e.style.bottom = "-2%";
        e.style.width = size + "px";
        e.style.height = size + "px";
        e.style.background =
          colors[Math.floor(Math.random() * colors.length)];
        e.style.boxShadow = "0 0 " + size * 2 + "px " + e.style.background;
        e.style.animationDuration = 10 + Math.random() * 15 + "s";
        e.style.animationDelay = Math.random() * 20 + "s";
        e.style.setProperty("--drift", Math.random() * 120 - 60 + "px");
        ec.appendChild(e);
      }
    })();
  </script>
